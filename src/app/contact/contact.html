<section class="contact-section">
  <div class="contact-container">
    <div class="contact-info">
      <span class="section-badge">Get In Touch</span>
      <h2>Contact Us</h2>
      <p>Have questions about our programs or need guidance on your fitness journey? We're here to help you every step of the way.</p>

      <div class="info-items">
        <div class="info-item">
          <div class="info-icon">
            <i class="bi bi-geo-alt-fill"></i>
          </div>
          <div>
            <h5>Location</h5>
            <p>Fitness ward, Starlight, Ogbomoso, Nigeria</p>
          </div>
        </div>

        <div class="info-item">
          <div class="info-icon">
            <i class="bi bi-envelope-fill"></i>
          </div>
          <div>
            <h5>Email</h5>
            <p>Trimfit@gmail.com</p>
          </div>
        </div>

        <div class="info-item">
          <div class="info-icon">
            <i class="bi bi-telephone-fill"></i>
          </div>
          <div>
            <h5>Phone</h5>
            <p>+234 800 123 4567</p>
          </div>
        </div>

        <div class="info-item">
          <div class="info-icon">
            <i class="bi bi-clock-fill"></i>
          </div>
          <div>
            <h5>Working Hours</h5>
            <p>Mon - Sat: 6am - 9pm</p>
          </div>
        </div>
      </div>
    </div>

    <div class="contact-form-wrapper">
      <form class="contact-form">
        <div class="form-row">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Adeola" required>
          </div>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="adeola@gmail.com" required>
          </div>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" placeholder="+234 906 560 6081" required>
        </div>

        <div class="form-group">
          <label for="subject">Subject</label>
          <select id="subject" name="subject" required>
            <option value="" disabled selected>Select a topic</option>
            <option value="general">General Inquiry</option>
            <option value="membership">Membership Plans</option>
            <option value="training">Personal Training</option>
            <option value="nutrition">Nutrition Guidance</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">Your Message</label>
          <textarea id="message" name="message" rows="5" placeholder="Tell us how we can help you..." required></textarea>
        </div>

        <button type="submit" class="btn-submit" (click)="onSubmit()" >
          <span>Send Message</span>
          <i class="bi bi-arrow-right"></i>
        </button>
      </form>
    </div>
  </div>
</section>
